name: Publish personal recipe organization image

on:
  push:
    branches:
      - codex/personal-recipe-organization-image
  workflow_dispatch:
    inputs:
      tag:
        description: Optional additional image tag
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-personal-recipe-organization-${{ github.ref }}
  cancel-in-progress: true

env:
  # The existing ghcr.io/magicwagon/mealie package is public and GitHub does
  # not allow public personal packages to be changed back to private.
  REGISTRY_IMAGE: ghcr.io/magicwagon/mealie-recipe-org

jobs:
  publish:
    name: Build and publish linux/amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=recipe-org
            type=sha,prefix=recipe-org-,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=recipe-org-${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=personal-recipe-organization-amd64
          cache-to: type=gha,mode=max,scope=personal-recipe-organization-amd64
